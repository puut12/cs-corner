{% extends 'base.html' %}

{% block meta %}
<title>Register - CS Corner</title>
{% endblock meta %}

{% block content %}
<div class="form-style">
  <div class="min-h-screen bg-gray-50 flex items-center justify-center p-8">
    <div class="max-w-md w-full relative z-10">
      <div class="bg-white border border-gray-200 rounded-lg p-8 shadow-sm">
      <div class="text-center mb-8">
        <h2 class="text-2xl font-semibold text-gray-900 mb-2">Join Us</h2>
        <p class="text-gray-500">Create your CS Corner account</p>
      </div>

      <!-- Container untuk pesan error dari AJAX -->
      <div id="ajax-form-errors" class="mb-6 hidden"></div>

      <!-- Form -->
      <form id="registerForm" method="POST" action="{% url 'main:register' %}" class="space-y-5">
        {% csrf_token %}
        
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
          <input 
            id="username" 
            name="username" 
            type="text" 
            required 
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 transition duration-200" 
            placeholder="Choose a username">
        </div>

        <div>
          <label for="password1" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input 
            id="password1" 
            name="password1" 
            type="password" 
            required 
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 transition duration-200" 
            placeholder="Create a password">
        </div>

        <div>
          <label for="password2" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
          <input 
            id="password2" 
            name="password2" 
            type="password" 
            required 
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:border-blue-500 transition duration-200" 
            placeholder="Confirm your password">
        </div>

        <button 
          type="submit" 
          class="w-full bg-blue-600 text-white font-medium py-3 px-4 rounded hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition duration-200">
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-500 text-sm">
          Already have an account? 
          <a href="{% url 'main:login' %}" class="text-blue-600 hover:text-blue-700 font-medium">
            Sign In
          </a>
        </p>
      </div>
      </div>
    </div>
  </div>
</div>
{% endblock content %}

{% block scripts %}
<script>
  const registerForm = document.getElementById('registerForm');
  const ajaxErrorsContainer = document.getElementById('ajax-form-errors');

  document.addEventListener('DOMContentLoaded', () => {
      const djangoErrors = document.querySelector('.form-style .mb-6');
      if (djangoErrors) {
          djangoErrors.remove();
      }
  });

  registerForm.addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    ajaxErrorsContainer.classList.add('hidden');
    ajaxErrorsContainer.innerHTML = '';

    try {
      const response = await fetch(this.action, {
        method: 'POST',
        body: formData,
        headers: {
            'X-Requested-With': 'XMLHttpRequest', // Identifikasi permintaan sebagai AJAX
            'X-CSRFToken': formData.get('csrfmiddlewaretoken')
        },
      });
      const data = await response.json();
      
      if (response.ok) {
        showToast('Success', data.message, 'success');
        setTimeout(() => {
            window.location.href = "{% url 'main:login' %}";
        }, 1500);
      } else {
        showToast('Registration Failed', 'Please check the errors below.', 'error');        
        ajaxErrorsContainer.classList.remove('hidden');
        let errorHtml = '';
        
        for (const field in data.message) {
            const errors = data.message[field];
            if (errors && errors.length) {
                const fieldName = field === '__all__' ? '' : `<strong>${field.charAt(0).toUpperCase() + field.slice(1)}:</strong>`;
                errorHtml += `<div class="px-4 py-3 rounded text-sm border bg-red-50 border-red-200 text-red-700 mb-2">${fieldName} ${errors.join(', ')}</div>`;
            }
        }
        ajaxErrorsContainer.innerHTML = errorHtml;
      }
    } catch (error) {
      showToast('Error', 'An unexpected error occurred. Please try again.', 'error');
    }
  });
</script>
{% endblock scripts %}
